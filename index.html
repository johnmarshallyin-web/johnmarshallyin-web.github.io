<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chicago Rent Finder</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}

#map {
    height: 600px;
    width: 90%;
    margin: auto;
    border-radius: 10px;
}

.controls {
    margin: 15px;
}
</style>
</head>

<body>

<h2>Chicago Neighborhood Rent Finder</h2>

<div class="controls">
    Budget: $
    <input type="number" id="budget" value="2000">
    <button onclick="updateColors()">Apply</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="rents.js"></script>

<script>

var map = L.map('map').setView([41.8781, -87.6298], 10);

// Use CARTO tiles (avoids OpenStreetMap blocking issue)
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO'
}).addTo(map);

let geoLayer;
let currentBudget = 2000;

function getColor(rent) {
    return rent <= currentBudget ? "green" : "red";
}

fetch("chicago.geojson")
.then(res => res.json())
.then(data => {

    geoLayer = L.geoJSON(data, {
        style: feature => {
            let name = feature.properties.community;
            let rent = rentData[name] || 1500;

            return {
                fillColor: getColor(rent),
                weight: 1,
                color: "black",
                fillOpacity: 0.6
            };
        },
        onEachFeature: (feature, layer) => {
            let name = feature.properties.community;
            let rent = rentData[name] || "Unknown";

            layer.bindPopup(`<b>${name}</b><br>Avg Rent: $${rent}`);
        }
    }).addTo(map);
});

function updateColors() {
    currentBudget = document.getElementById("budget").value;

    geoLayer.setStyle(feature => {
        let rent = rentData[feature.properties.community] || 1500;
        return {
            fillColor: getColor(rent),
            weight: 1,
            color: "black",
            fillOpacity: 0.6
        };
    });
}

</script>

</body>
</html>
