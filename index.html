<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chicago Rent Finder</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}

#sidebar {
    position: fixed;
    top: 100px;
    right: 20px;
    width: 220px;
    background: #222;
    color: white;
    padding: 15px;
    border-radius: 10px;
    z-index: 1000;
}

#map {
    height: 600px;
    width: 90%;
    margin: auto;
    border-radius: 10px;
}

.controls {
    margin: 15px;
}

/* Smooth hover animation */
.leaflet-interactive {
    transition: all 0.2s ease;
}

/* Labels */
.label {
    font-size: 9px;
    font-weight: bold;
    color: white;
    text-align: center;
    background: rgba(0,0,0,0.6);
    padding: 2px 4px;
    border-radius: 4px;
    pointer-events: none; /* 🔥 prevents blocking clicks */
    opacity: 0.9;
    transition: opacity 0.2s ease;
}
</style>
</head>

<body>

<h2>Chicago Neighborhood Rent Finder</h2>

<div class="controls">
    Budget: $
    <input type="number" id="budget" value="2000">
    <button onclick="updateColors()">Apply</button>
</div>

<div id="sidebar">
    <h3 id="area-name">Click a neighborhood</h3>
    <p id="area-rent">Rent: --</p>
    <p id="area-info">Hover or click for details</p>
</div>

<div class="controls">
    <h3>Rent Budget Calculator</h3>

    <input type="number" id="hourly" placeholder="Hourly wage ($)">
    <input type="number" id="salary" placeholder="Annual salary ($)">
    
    <button onclick="calculateBudget()">Calculate Budget</button>

    <p id="recommended"></p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="rents.js"></script>

<script>

// Initialize map
var map = L.map('map').setView([41.8781, -87.6298], 10);

// Tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO'
}).addTo(map);

let geoLayer;
let currentBudget = 2000;
let labels = []; // 🔥 store labels

function getColor(rent) {
    return rent <= currentBudget ? "green" : "red";
}

// Hover highlight
function highlightFeature(e) {
    let layer = e.target;

    layer.setStyle({
        weight: 4,
        color: "#fff",
        fillOpacity: 0.9
    });

    layer.bringToFront();
}

function resetHighlight(e) {
    geoLayer.resetStyle(e.target);
}

// Sidebar
function showSidebar(name, rent) {
    document.getElementById("area-name").innerText = name;
    document.getElementById("area-rent").innerText = "Avg Rent: $" + rent;

    let info = "";

    if (rent < 1500) info = "💰 Very affordable";
    else if (rent < 2200) info = "👍 Moderate price";
    else info = "💸 Expensive area";

    document.getElementById("area-info").innerText = info;
}

// Load GeoJSON
fetch("chicago.geojson")
.then(res => res.json())
.then(data => {

    geoLayer = L.geoJSON(data, {
        style: feature => {
            let name = (feature.properties.community || "").toUpperCase();
            let rent = rentData[name] || 1500;

            return {
                fillColor: getColor(rent),
                weight: 1,
                color: "black",
                fillOpacity: 0.6
            };
        },

        onEachFeature: (feature, layer) => {
            let name = (feature.properties.community || "").toUpperCase();
            let rent = rentData[name] || "Unknown";

            // Interactions
            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight,
                click: () => showSidebar(name, rent)
            });

            layer.bindPopup(`<b>${name}</b><br>Avg Rent: $${rent}`);

            // 🏷️ Label (stored, not added yet)
            let center = layer.getBounds().getCenter();

            let label = L.marker(center, {
                icon: L.divIcon({
                    className: 'label',
                    html: name,
                    iconSize: [100, 20]
                }),
                interactive: false
            });

            labels.push(label);
        }

    }).addTo(map);

    updateLabels(); // run once after load
});

// Show/hide labels based on zoom
function updateLabels() {
    let zoom = map.getZoom();

    labels.forEach(label => {
        if (zoom >= 11) {
            if (!map.hasLayer(label)) {
                label.addTo(map);
            }
        } else {
            if (map.hasLayer(label)) {
                map.removeLayer(label);
            }
        }
    });
}

// Run on zoom
map.on("zoomend", updateLabels);

// Update colors
function updateColors() {
    if (!geoLayer) return;

    currentBudget = document.getElementById("budget").value;

    geoLayer.setStyle(feature => {
        let name = (feature.properties.community || "").toUpperCase();
        let rent = rentData[name] || 1500;

        return {
            fillColor: getColor(rent),
            weight: 1,
            color: "black",
            fillOpacity: 0.6
        };
    });
}

// Budget calculator
function calculateBudget() {
    let hourly = document.getElementById("hourly").value;
    let salary = document.getElementById("salary").value;

    let monthlyIncome = 0;

    if (hourly) {
        monthlyIncome = hourly * 40 * 4;
    } else if (salary) {
        monthlyIncome = salary / 12;
    } else {
        document.getElementById("recommended").innerText = "Enter income first.";
        return;
    }

    let rentBudget = Math.round(monthlyIncome * 0.3);

    document.getElementById("recommended").innerText =
        "Recommended Rent Budget: $" + rentBudget;

    document.getElementById("budget").value = rentBudget;

    updateColors();
}

</script>

</body>
</html>
